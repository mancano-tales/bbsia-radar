name: Renderizar e publicar relatório Quarto

on:
  pull_request:
    paths:
      - "report/**"
      - "data/relatorios/**"
      - ".github/workflows/publish-report.yml"
  push:
    branches:
      - main
    paths:
      - "report/**"
      - "data/relatorios/**"
      - ".github/workflows/publish-report.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Renderizar HTML e PDF
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Instalar Quarto e TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"
          tinytex: true

      - name: Renderizar o site e o relatório
        run: quarto render report

      - name: Conferir HTML, PDF e link de download
        shell: bash
        run: |
          test -s report/_site/index.html
          test -s report/_site/apresentacao.html
          test -s report/_site/apresentacao.pdf
          test -s report/_site/metodo.html
          test -s report/_site/relatorio.html
          test -s report/_site/relatorio.pdf
          grep -q 'href="relatorio.pdf"' report/_site/relatorio.html
          grep -q 'href="apresentacao.pdf"' report/_site/apresentacao.html
          # A marca do BBSIA só pode aparecer junto do aviso de proposta
          # independente (decisão do autor, 2026-09-29; plano #28 §2.3).
          grep -q 'Este site não é do BBSIA' report/_site/index.html
          grep -q 'disclaimer-panel' report/_site/index.html
          grep -q 'Documento para discussão' report/_site/apresentacao.html
          grep -q 'Proposta independente' report/_site/metodo.html
          grep -q 'Proposta independente' report/_site/relatorio.html
          grep -q 'Não é um site oficial do BBSIA' report/_site/index.html
          for page in report/_site/*.html; do
            if grep -q 'bbsia-logo' "$page"; then
              grep -q 'disclaimer-panel' "$page" || { echo "::error::$page usa a marca fora do aviso"; exit 1; }
            fi
          done
          test ! -e report/_site/assets/og-image.png

      - name: Enviar o site completo como artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: report/_site

  deploy:
    name: Publicar no GitHub Pages
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.PAGES_PUBLISH_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato validado
        id: deployment
        uses: actions/deploy-pages@v4
