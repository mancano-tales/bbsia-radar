# ==============================================================================
# codebook.yml — Livro de códigos do bbsia-radar / bbsia-radar codebook
#
# (pt) Decide o que entra no radar e como cada solução é descrita. É escrito
#      ANTES da coleta e usado de três formas:
#        1. pelas regras automáticas (R/, WP5 passo 1);
#        2. como instrução ao LLM que classifica o resto (WP5 passo 2);
#        3. como guia de quem codifica a amostra humana de validação (WP5 passo 3).
#      Mudou o codebook? Suba `versao`, registre o motivo no commit/issue e
#      recodifique a amostra; NEWS.md recebe somente notas de versão lançada.
# (en) Decides what enters the radar and how each solution is described. Written
#      BEFORE data collection; read by the rule engine, by the LLM classifier and
#      by human coders. Any change bumps `versao` and triggers re-coding.
#
# Issues: #3 (base) e #24 (ampliação pública e série longitudinal).
#
# Status das decisões: cada caso-limite traz `decisao_status`:
#   proposta        -> escolha do agente, vale até o autor revisar;
#   autor           -> decidida pelo autor (registrada por commit, nunca em comentário);
#   depende_bbsia   -> depende da coordenação do BBSIA (issue #2 / plano §3).
# ==============================================================================

versao: "0.2.1"
data: "2026-09-28"
status: rascunho          # rascunho | em_validacao | estavel
issue: 24
versao_anterior: "0.2.0"
formulario_bbsia: "config/formulario_bbsia.yml"
politica_migracao: >
  As versões anteriores permanecem no histórico Git. Nenhum valor antigo é substituído
  em silêncio. Reclassificar uma amostra com a 0.2.1 e registrar lado a lado
  rótulo anterior, rótulo novo, motivo, fonte e decisão humana.

# ------------------------------------------------------------------------------
# 1. Unidade de análise / unit of analysis
# ------------------------------------------------------------------------------
unidade_de_analise:
  definicao: >
    Uma SOLUÇÃO: algo que alguém pode usar para resolver um problema (aplicação,
    biblioteca, modelo, base de dados, benchmark). Não é um repositório: uma
    solução pode ter vários artefatos em plataformas diferentes.
  agregacao:
    - regra: "Modelo no Hugging Face + código no GitHub do mesmo grupo, que se citam mutuamente = 1 solução, com as duas URLs."
    - regra: "Família de modelos do mesmo projeto (tamanhos base/large, versões v1/v2) = 1 solução; as variantes vão em `artefatos`."
    - regra: "Dataset criado para treinar um modelo do mesmo projeto = mesma solução. Dataset reutilizável e documentado por si = solução própria (tipo `dataset`)."
    - regra: "Organização com vários projetos independentes = 1 solução por projeto, nunca 1 por organização."
  chave: >
    `id_solucao` = slug estável (ex.: `neuralmind-bertimbau`); `artefatos` = lista
    de {plataforma, url, papel}. A deduplicação contra o BBSIA (WP7) opera sobre
    soluções, não sobre URLs.

# ------------------------------------------------------------------------------
# 2. Filtro de entrada: é IA? / Entry filter: is it AI?
# ------------------------------------------------------------------------------
e_ia:
  pergunta: "A solução usa, produz ou avalia um modelo aprendido a partir de dados?"
  valores: [sim, nao, incerto]
  inclui:
    - "Aprendizado de máquina clássico ou profundo (classificação, regressão, agrupamento)."
    - "Modelos de linguagem, de fala, de visão, multimodais; embeddings; RAG."
    - "Ferramentas cujo núcleo é chamar um modelo (ex.: transcrição com Whisper, codificação de texto por LLM)."
    - "Bases de dados e benchmarks feitos para treinar ou avaliar IA."
  exclui:
    - "Automação por regras fixas, RPA sem modelo, raspadores, CRUD, painéis de dados."
    - "Pacotes de acesso a dados públicos sem modelo (valiosos, mas fora do escopo do BBSIA de IA)."
  nota: "`nao` elimina a solução; `incerto` vai para revisão humana."
  regra_de_decisao: >
    `sim` exige evidência citável de uso, produção ou avaliação de modelo
    aprendido a partir de dados. O silêncio da documentação leva a `incerto`,
    nunca a `nao`. `nao` exige evidência positiva de que o mecanismo é
    exclusivamente baseado em regras fixas ou outra técnica sem modelo.
    Evidências conflitantes levam a `incerto` e revisão humana.

# ------------------------------------------------------------------------------
# 3. Vínculo com o Brasil / Link to Brazil
#    (pt) Três marcações INDEPENDENTES, não uma categoria exclusiva: um modelo
#         pode ser brasileiro E adaptado ao pt-BR. Entra no piloto quem tem
#         `brasileira` ou `ptbr` = sim.
#    (en) Three independent flags, not mutually exclusive categories.
# ------------------------------------------------------------------------------
vinculo:
  brasileira:
    rotulo: "A — Brasileira"
    definicao: >
      Feita, mantida ou financiada principalmente por pessoa, grupo, empresa,
      universidade ou órgão sediado no Brasil.
    valores: [sim, nao, incerto]
    sinais:
      fortes:
        - "Dono (usuário ou organização) na lista semente de instituições brasileiras (`config/seeds.yml`)."
        - "README, model card ou artigo nomeia instituição brasileira como autora."
        - "Financiamento brasileiro declarado (CNPq, CAPES, FAPs, FINEP, BNDES, órgão público)."
        - "Site oficial do projeto em domínio `.br`."
      medios:
        - "Campo `location` do dono cita Brasil, uma UF ou uma cidade brasileira."
        - "Documentação principal em português brasileiro."
        - "Contribuidores principais com `location` no Brasil."
      fracos:
        - "Nome do projeto em português."
        - "Problema tipicamente brasileiro (SUS, ENEM, Pix, CPF, Diário Oficial)."
    regra_de_decisao: >
      `sim` com 1 sinal forte, ou 2 médios. `incerto` com 1 médio ou só fracos.
      `incerto` sem sinais; silêncio da fonte não demonstra origem estrangeira.
      `nao` exige evidência positiva de origem não brasileira. Sinal fraco
      sozinho nunca basta.
    exemplos_sim:
      - "Transcritório (antrologos): app de transcrição de entrevistas, autor brasileiro."
      - "BERTimbau (NeuralMind): modelo e código de empresa brasileira."
    exemplos_nao:
      - "Whisper (OpenAI): usado em muitas soluções brasileiras, mas não é uma delas."

  ptbr:
    rotulo: "B — Adaptada ao português brasileiro"
    definicao: >
      Treinada, ajustada ou avaliada especificamente em português brasileiro, ou
      que tem o pt-BR como funcionalidade central, e não como um entre dezenas
      de idiomas.
    valores: [sim, nao, incerto]
    sinais:
      fortes:
        - "Model card ou README diz que o modelo foi treinado ou ajustado em dados em português do Brasil."
        - "Avaliação em benchmark brasileiro (ex.: questões do ENEM, da OAB, de concursos) reportada pelo próprio projeto."
        - "Dataset composto de texto, fala ou imagem de fontes brasileiras."
      medios:
        - "Tag `language:pt` no Hugging Face E menção a Brasil/pt-BR no card."
        - "Tópicos do GitHub `brazilian-portuguese`, `pt-br`."
      fracos:
        - "Tag `language:pt` sozinha (pode ser pt-PT, ou só um entre muitos idiomas)."
        - "Tópico `portuguese` ou `portuguese-nlp` sozinho."
    regra_de_decisao: >
      `sim` com 1 sinal forte, ou 2 médios. `incerto` com 1 médio sozinho, só
      sinais fracos, ausência de sinais, ou sinais conflitantes (ex.:
      `language:pt` mas documentação só sobre pt-PT). `nao` exige evidência
      explícita de não adaptação ao pt-BR. Modelo multilíngue genérico que
      apenas inclui português = `nao` quando isso está documentado.
    exemplos_sim:
      - "Tucano / TeenyTinyLlama (Nicholas Kluge Corrêa): modelos treinados em português."
    exemplos_nao:
      - "Um LLM multilíngue que lista `pt` entre 100 idiomas, sem ajuste nem avaliação em pt-BR."

  interesse_publico:
    rotulo: "C — De interesse público, adaptável"
    definicao: >
      Solução aberta que resolve um problema típico do setor público e poderia
      ser adaptada ao Brasil, mesmo sem vínculo com o país.
    # Dimensão RESERVADA na v0.2.1, não codificável. Único valor permitido nesta
    # versão: `nao_avaliado`. Sinais, regra de decisão e exemplos entram numa
    # versão futura, junto com os valores sim/nao/incerto.
    valores: [nao_avaliado]
    no_piloto: false
    nota: >
      Fora do piloto: sem critério mais preciso, o volume explode. Critério a
      combinar com a coordenação do BBSIA (plano §3, pergunta 5).

# ------------------------------------------------------------------------------
# 4. Exclusões / Exclusions (valem antes de qualquer marcação)
# ------------------------------------------------------------------------------
exclusoes:
  - codigo: fork_sem_mudanca
    descricao: "Fork sem commits próprios relevantes. Um fork com adaptação ao pt-BR NÃO é excluído (ver caso-limite)."
  - codigo: reupload_modelo
    descricao: "Cópia ou quantização de modelo de terceiros (GGUF, AWQ, etc.) sem treino, ajuste ou avaliação própria."
  - codigo: material_didatico
    descricao: "Tutorial, curso, exercício de disciplina, notebook de estudo, portfólio pessoal."
  - codigo: lista_curada
    descricao: "Lista 'awesome' ou diretório. Vira fonte de sementes, não solução."
  - codigo: vazio
    descricao: "Repositório só com README, sem código, modelo ou dados utilizáveis."
  - codigo: so_pt_pt
    descricao: "Feito em Portugal e só para pt-PT, sem uso ou avaliação em pt-BR."
  - codigo: dados_pessoais
    descricao: "Expõe dados pessoais (vazamentos, raspagem de perfis). Excluir e não registrar o conteúdo."
  - codigo: nao_acessivel
    descricao: "Sem código, modelo ou API publicamente acessível (o radar só vê o que é público)."

# ------------------------------------------------------------------------------
# 5. Descrição da solução / Describing the solution
# ------------------------------------------------------------------------------
tipo_artefato:
  valores:
    aplicacao: "Sistema ou app pronto para uso final (desktop, web, bot)."
    biblioteca: "Pacote ou biblioteca para desenvolvedores (R, Python, JS...)."
    modelo: "Modelo treinado disponível para uso."
    dataset: "Base de dados ou corpus para treinar ou avaliar IA."
    benchmark: "Conjunto de avaliação com protocolo e métricas."
    demo: "Demonstração (ex.: Space do Hugging Face) sem uso real previsto."
    api: "Serviço acessado por uma interface documentada."
    servidor_mcp: "Servidor MCP que conecta ferramentas a um agente de IA."
    agente_ia: "Assistente capaz de executar tarefas com ferramentas."
    pipeline: "Fluxo de processamento de dados reutilizável."
    guia_metodologia: "Guia, publicação ou metodologia reutilizável."
    outro: "Formato documentado que não cabe nas categorias anteriores."
  nota: "Escolher o principal; os outros artefatos vão em `artefatos`."
  mapeamento_formulario:
    aplicacao: "Aplicação ou sistema pronto para usar"
    biblioteca: "Código ou biblioteca para instalar e adaptar"
    api: "API (serviço que outros sistemas consultam)"
    servidor_mcp: "Servidor MCP (conecta ferramentas a um agente de IA)"
    agente_ia: "Agente de IA (assistente que executa tarefas)"
    modelo: "Modelo de IA treinado"
    dataset: "Dataset (uma base de dados)"
    pipeline: "Pipeline / fluxo de processamento de dados"
    guia_metodologia: "Guia, publicação ou metodologia"
    outro: "Outro (descreva nas observações)"
  mapeamento_manual: [benchmark, demo]

area_problema:
  status: provisorio      # substituir pelo vocabulário do BBSIA quando a issue #2 trouxer
  multiplo: true
  maximo: 2               # no máximo 2 áreas; a primeira é a área principal
  valores:
    - saude
    - educacao
    - justica_e_direito
    - seguranca_publica
    - gestao_publica          # processos internos, compras, RH, documentos
    - atendimento_ao_cidadao
    - transparencia_e_controle
    - financas_e_tributos
    - trabalho_e_assistencia_social
    - meio_ambiente_e_agro
    - infraestrutura_e_mobilidade
    - ciencia_e_pesquisa
    - cultura_e_linguagem     # inclui PLN em português de uso geral
    - transversal             # ferramentas genéricas (transcrição, OCR, anonimização)
  mapeamento_formulario:
    saude: "Saúde"
    educacao: "Educação"
    seguranca_publica: "Segurança Pública"
    financas_e_tributos: "Fazenda/Tributação"
  mapeamento_manual:
    - meio_ambiente_e_agro
    - gestao_publica
    - justica_e_direito
    - atendimento_ao_cidadao
    - transparencia_e_controle
    - trabalho_e_assistencia_social
    - infraestrutura_e_mobilidade
    - ciencia_e_pesquisa
    - cultura_e_linguagem
    - transversal

problema_resumo:
  descricao: >
    1 a 2 frases, em português simples, no formato "Ajuda <quem> a <resolver o
    quê>", sem jargão técnico. É a primeira coisa que o BBSIA mostra de uma solução.
  exemplo: "Ajuda pesquisadores a transcrever e identificar falantes em entrevistas gravadas em português, sem enviar o áudio para a internet."
  proibido: "Descrever a tecnologia antes do problema (\"Um modelo BERT que...\")."

# ------------------------------------------------------------------------------
# 6. Maturidade / Maturity — ESTIMATIVA, revisável pela equipe do BBSIA
# ------------------------------------------------------------------------------
maturidade:
  trl_provavel:
    nota: >
      "Todos os TRLs" entram (combinado com o BBSIA): maturidade é coluna, não
      filtro. A escala exata do formulário depende da issue #2.
    faixas:
      "1-3":
        rotulo: "Ideia ou prova de conceito"
        sinais: ["repositório recente ou parado", "sem release", "sem documentação de uso", "1 contribuidor"]
      "4-6":
        rotulo: "Protótipo validado"
        sinais: ["README com instalação e exemplo", "avaliação ou resultados reportados", "algum uso (estrelas, downloads)", "atividade nos últimos 12 meses"]
      "7-9":
        rotulo: "Em operação"
        sinais: ["uso institucional em produção declarado e citável", "documentação de implantação real"]
    cautela: >
      Estrelas, downloads, releases, atividade e vários contribuidores não
      comprovam uso externo ou TRL 7-9. O TRL é estimativa separada do campo
      de maturidade do formulário e exige revisão humana antes de publicação.
  ativo:
    definicao: "Houve push (GitHub) ou atualização (Hugging Face) nos últimos 12 meses."
    valores: [sim, nao]
  manutencao:
    definicao: "Sinais de que alguém cuida: issues respondidas, PRs aceitos, mais de um contribuidor."
    valores: [alta, media, baixa, sem_sinal]

# ------------------------------------------------------------------------------
# 7. Confiança e proveniência / Confidence and provenance
# ------------------------------------------------------------------------------
confianca:
  valores:
    alta: "Decidida por sinal forte, ou por humano."
    media: "Decidida por sinais médios concordantes."
    baixa: "Decidida com sinais fracos ou conflitantes. Vai para revisão humana antes de sair na planilha."
proveniencia:
  valores: [regra, llm, humano]
  nota: "Toda marcação registra quem a fez e, para `llm`, o modelo e a versão do codebook."

# ------------------------------------------------------------------------------
# 8. Casos-limite / Edge cases
# ------------------------------------------------------------------------------
casos_limite:
  - caso: "Brasileiro que mora e trabalha no exterior, projeto pessoal."
    decisao: "brasileira = incerto; sim se o projeto tem foco no Brasil (dados, idioma, problema)."
    decisao_status: autor
  - caso: "Empresa estrangeira com filial ou equipe no Brasil."
    decisao: "brasileira = sim só se o projeto foi feito pela equipe brasileira e isso está declarado."
    decisao_status: autor
  - caso: "Fork de projeto estrangeiro com adaptação ao pt-BR (tradução, ajuste, dados)."
    decisao: "Não é exclusão `fork_sem_mudanca`; ptbr = sim; brasileira segue as regras do autor do fork."
    decisao_status: autor
  - caso: "Projeto de Portugal que também é usado ou avaliado em pt-BR."
    decisao: "brasileira = nao; ptbr = sim se houver avaliação explícita em pt-BR."
    decisao_status: autor
  - caso: "TCC, dissertação ou projeto acadêmico encerrado, com código publicado."
    decisao: "Entra se passar nos critérios; TRL 1-3 e ativo = nao, mas não é excluído (todos os TRLs)."
    decisao_status: autor
  - caso: "Produto comercial fechado com só uma API ou SDK público (ex.: cliente de API de um LLM brasileiro)."
    decisao: "Entra como solução se a API é pública e documentada; a planilha marca que o núcleo é fechado."
    decisao_status: depende_bbsia
  - caso: "Solução de órgão público já cadastrada no BBSIA com outro nome."
    decisao: "Deduplicação (WP7) casa por URL e por nome; em dúvida, marcar `possivel_duplicata` e não enviar."
    decisao_status: autor
  - caso: "Pacote de acesso a dados públicos brasileiros sem modelo (ex.: ecossistema de pacotes R de dados oficiais)."
    decisao: "e_ia = nao, fora do radar; pode ir para a lista de sementes como fonte de dados para soluções de IA."
    decisao_status: depende_bbsia

# ------------------------------------------------------------------------------
# 9. Validação humana / Human validation (WP5 passo 3)
# ------------------------------------------------------------------------------
validacao:
  amostra: >
    Aleatória, estratificada por fonte (GitHub, Hugging Face, sementes) e pela
    marcação automática (sim/incerto/nao). Tamanho inicial: 100 soluções, ou
    todas, se houver menos.
  codificadores: "O autor codifica a amostra; uma segunda pessoa, se possível, codifica às cegas 30 unidades para medir reprodutibilidade humana."
  cego: "Quem codifica não vê a marcação da máquina."
  metricas: >
    Concordância percentual e kappa de Cohen entre dois codificadores humanos
    nas 30 unidades duplamente codificadas, por dimensão de rótulo único
    (`e_ia`, `brasileira`, `ptbr`, `tipo_artefato`). Para `area_problema`
    (multirrótulo): kappa de Cohen na área principal (a primeira listada) e,
    para cada área do vocabulário, kappa da marcação binária presente/ausente.
  limiar: >
    Kappa humano >= 0.70 em `brasileira`, `ptbr` e `e_ia` para considerar
    suficientemente reproduzível a aplicação do codebook. Separadamente, medir
    a classificação automática contra a codificação humana adjudicada na amostra
    completa, reportando precisão, recall, F1 e kappa por dimensão; não dispensar
    revisão automática apenas com base no kappa entre humanos. Abaixo do limiar
    humano, revisar o codebook, subir `versao` e recodificar. `area_problema` e `tipo_artefato` ficam sem limiar
    (exploratórias) enquanto o vocabulário for provisório (issue #2): até lá,
    toda classificação dessas colunas passa por revisão humana. Protocolo
    aprovado pelo autor; a amostra vem do próprio corpus de candidatos e não
    depende de baixar a base do BBSIA. Essa base só é necessária para medir
    cobertura/deduplicação no nível de registros.
  desempate: "Divergência entre humanos: o autor decide e o caso vira exemplo neste arquivo."

# ------------------------------------------------------------------------------
# 10. Campos de saída / Output fields (mapa provisório para a planilha)
#     Os nomes finais seguem o formulário do BBSIA (issue #2).
# ------------------------------------------------------------------------------
campos_saida:
  - id_solucao
  - nome
  - problema_resumo
  - area_problema
  - tipo_artefato
  - artefatos            # lista de {plataforma, url, papel}
  - responsavel          # nome público do dono (organização ou pessoa); nunca e-mail
  - brasileira
  - ptbr
  - interesse_publico
  - e_ia
  - trl_provavel
  - ativo
  - manutencao
  - licenca
  - confianca
  - proveniencia
  - versao_codebook
  - ja_no_bbsia          # sim | nao | possivel_duplicata
  - estado_revisao
  - evidencias
  - campos_publicos_bbsia

# ------------------------------------------------------------------------------
# 11. Campos públicos do formulário / public form fields (issue #24)
# ------------------------------------------------------------------------------
campos_publicos:
  politica_geral: >
    Cada valor observável guarda estado, URL da fonte, trecho ou campo exato,
    data de captura, data declarada na fonte quando existir, rodada, revisor,
    versão do codebook e confiança. Ausência de menção fica
    nao_verificavel_publicamente; não vira resposta negativa. Uma proposta de
    LLM não é uma declaração da instituição. Para cada valor multivalorado,
    guardar evidência e revisão independentes.
  estados:
    - declarado_na_fonte
    - inferido
    - nao_verificavel_publicamente
    - nao_se_aplica
    - conflitante
  revisao:
    estados: [proposto, revisado, rejeitado]
    regra: "Só fatos revisados entram na ficha pública; divergência permanece no log de eventos."
  campos:
    nome_solucao:
      responsavel: radar
      regra: "Nome declarado no repositório ou card; preservar URL e data da captura."
    problema:
      responsavel: decifra_com_revisao_humana
      regra: "Uma frase em linguagem comum, sustentada por trecho do documento; não inventar problema."
    funcionamento:
      responsavel: decifra_com_revisao_humana
      regra: "Descrição do mecanismo declarado; separar resumo da citação original."
    tecnologia_ia:
      responsavel: decifra_com_revisao_humana
      regra: "Mapear para opção observada do formulário apenas se documentação sustentar; senão nao_verificavel_publicamente."
    tipo_ativo:
      responsavel: decifra_com_revisao_humana
      regra: "Mapear tipo_artefato do radar para opção do formulário; equivalência não é presumida."
    area:
      responsavel: decifra_com_revisao_humana
      regra: "Formulário aceita uma área; preservar até duas áreas internas do radar sem inventar equivalência."
    ja_usado:
      responsavel: humano
      regra: "Só marcar uso externo com declaração pública específica; métricas de plataforma não provam uso."
    ponto_atual:
      responsavel: humano
      regra: "Estágio declarado; TRL estimado é campo separado e não substitui resposta do formulário."
    aberta:
      responsavel: radar_com_revisao_humana
      regra: "Capturar licença e acesso, mas reuso institucional exige avaliação; repo público não basta."
    recursos_publicos:
      responsavel: decifra_com_revisao_humana
      regra: "Usar só declaração específica de financiamento; órgão público autor não basta."
    soberania:
      responsavel: decifra_com_revisao_humana
      regra: "Registrar dependências declaradas; silêncio não prova autonomia."
    dado_sensivel:
      responsavel: decifra_com_revisao_humana
      regra: "Registrar processamento declarado; não certificar ausência nem conformidade."
    links:
      responsavel: radar
      regra: "Somente links da própria solução, com papel e plataforma; preservar aliases."
    resultados:
      responsavel: decifra_com_revisao_humana
      regra: "Relato da fonte com população, período e método quando existirem; não afirmar efeito causal."
    orgao_nivel_uf_municipio:
      responsavel: humano
      regra: "Atribuir somente com afiliação institucional pública explícita."
    disposicao_aberto:
      responsavel: humano
      regra: "Sem declaração institucional específica, nao_verificavel_publicamente; licença não equivale a disposição."
  campos_de_contato_proibidos: [email, nome_respondente, cargo_respondente, telefone, consentimento]
