#     Dois usos: (1) recall — o radar as encontra sozinho?; (2) validade externa —
#     a área atribuída pelo BBSIA serve de gabarito para `area_problema`.
#     Na saída final elas saem como `ja_no_bbsia: sim`. Depende do export (#2).
#     O autor não cadastrou nenhuma solução à mão (informado em 2026-09-26).
