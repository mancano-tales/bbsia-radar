# ==============================================================================
# seeds.yml — Sementes curadas e gabarito de recall / curated seeds and recall set
#
# (pt) Pontos de partida da descoberta (WP3) e, ao mesmo tempo, GABARITO: toda
#      entrada em `gabarito` é uma solução que já sabemos que existe. Um coletor
#      que não a encontra está mal calibrado; o recall contra esta lista vai para
#      o relatório.
# (en) Discovery starting points (WP3) and a known-positives set used to measure
#      collector recall.
#
# Issue: #4 · Plano: repo-governance/plan/2026-09-26_Plano_Piloto_bbsia-radar.md §6
#
# Campo `verificado` / verification field:
#   existe:  o endereço responde (true/false/null = não conferido)
#   vinculo: alguém leu a página e confirmou o vínculo com o Brasil/pt-BR
#            segundo o codebook (true/false/null = não conferido)
#   em, como: quando e como foi conferido
# NUNCA marque `vinculo: true` sem ter aberto a página. Nome conhecido não é prova.
# ==============================================================================

versao: "0.1.0"
data: "2026-09-26"
issue: 4

# ------------------------------------------------------------------------------
# 1. Listas curadas / Curated lists — fontes de candidatos, não soluções
# ------------------------------------------------------------------------------
listas:
  - nome: "awesome-open-source-research-tools"
    url: "https://github.com/mancano-tales/awesome-open-source-research-tools"
    nota: "Lista do autor. Dados em data/tools.json; itens brasileiros levam a tag `brazil`."
    verificado: { existe: true, vinculo: true, em: "2026-09-26", como: "clone e leitura de data/tools.json" }
  - nome: "awesome-Portuguese-NLP"
    url: "https://github.com/davidsbatista/awesome-Portuguese-NLP"
    nota: "Mistura pt-PT e pt-BR: cada item passa pelo codebook (exclusão so_pt_pt)."
    verificado: { existe: true, vinculo: null, em: "2026-09-26", como: "git ls-remote" }
  - nome: "Portuguese-NLP"
    url: "https://github.com/ajdavidl/Portuguese-NLP"
    nota: "Mesma ressalva sobre pt-PT."
    verificado: { existe: true, vinculo: null, em: "2026-09-26", como: "git ls-remote" }

# ------------------------------------------------------------------------------
# 2. Gabarito / Known positives — soluções que o radar TEM de encontrar
# ------------------------------------------------------------------------------
gabarito:
