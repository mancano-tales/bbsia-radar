      - { plataforma: github, url: "https://github.com/antrologos/Transcritorio", papel: codigo }
    esperado: { e_ia: sim, brasileira: sim, ptbr: sim, tipo_artefato: aplicacao }
    fonte: "awesome-open-source-research-tools (tag brazil): app local de transcrição e diarização de entrevistas em português brasileiro."
    verificado: { existe: true, vinculo: true, em: "2026-09-26", como: "git ls-remote; confirmado pelo autor em chat" }
    nota: "É o transcritor citado pelo autor na conversa com o BBSIA (confirmado em 2026-09-26). Usa o Whisper e o modelo brasileiro Tagarela (ver entrada abaixo)."
