project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - metodo.qmd
    - relatorio.qmd
  resources:
    - assets/*.png

website:
  title: "Radar Brasileiro de Soluções de IA"
  site-url: https://mancano-tales.github.io/bbsia-radar/
  description: >-
    Radar de soluções de IA brasileiras, adaptadas ao português brasileiro ou de
    interesse público adaptáveis, com fontes, método e limites documentados.
  page-navigation: true
  image: assets/og-image.png
  favicon: assets/favicon-32x32.png
  open-graph:
    image: assets/og-image.png
    image-width: 1200
    image-height: 630
  twitter-card:
    image: assets/og-image.png
    image-width: 1200
    image-height: 630
    card-style: summary_large_image
  navbar:
    background: "#183b60"
    foreground: "#ffffff"
    logo: assets/bbsia-logo-transparent.svg
    logo-alt: "Símbolo do BBSIA"
    left:
      - href: index.qmd
        text: Início
      - href: metodo.qmd
        text: Método
      - href: relatorio.qmd
        text: Relatório
    right:
      - icon: github
        href: https://github.com/mancano-tales/bbsia-radar
        aria-label: Repositório do bbsia-radar no GitHub

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      text: |
        <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    smooth-scroll: true

lang: pt-BR
