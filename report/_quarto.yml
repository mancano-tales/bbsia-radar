project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - apresentacao.qmd
    - metodo.qmd
    - relatorio.qmd
website:
  title: "Radar de soluções de IA brasileiras"
  description: >-
    Proposta independente de Tales Mançano, voluntário do BBSIA: procurar soluções
    de IA brasileiras publicadas no GitHub, no Hugging Face e no GitLab e preparar
    fichas para revisão. Não é uma iniciativa oficial do BBSIA.
  page-navigation: true
  page-footer:
    center: "Proposta independente de Tales Mançano, voluntário do BBSIA. Não é um site oficial do BBSIA nem tem endosso do programa."
  navbar:
    background: "#123a3a"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Início
      - href: apresentacao.qmd
        text: Proposta
      - href: metodo.qmd
        text: Método
      - href: relatorio.qmd
        text: Resultados
    right:
      - icon: github
        href: https://github.com/mancano-tales/bbsia-radar
        aria-label: Repositório do bbsia-radar no GitHub

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    smooth-scroll: true

lang: pt-BR
