project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - apresentacao.qmd
    - metodo.qmd
    - relatorio.qmd
website:
  title: "Proposta de radar de soluções de IA"
  description: >-
    Proposta independente de Tales Mançano, voluntário do BBSIA, para apreciação
    pela coordenação do programa. Ainda não é uma iniciativa oficial do BBSIA.
  page-navigation: true
  page-footer:
    center: "Proposta independente de Tales Mançano, voluntário do BBSIA. Sem caráter oficial ou endosso institucional."
  navbar:
    background: "#123a3a"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Início
      - href: apresentacao.qmd
        text: Proposta
      - href: metodo.qmd
        text: Método
      - href: relatorio.qmd
        text: Relatório
    right:
      - icon: github
        href: https://github.com/mancano-tales/bbsia-radar
        aria-label: Repositório do bbsia-radar no GitHub

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    smooth-scroll: true

lang: pt-BR
